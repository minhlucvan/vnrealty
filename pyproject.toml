[project]
name = "vnrealty"
version = "0.1.0"
description = "A quantitative real-estate investing desk for Vietnam, starting with Đà Nẵng"
requires-python = ">=3.12"
dependencies = []          # stdlib only, on purpose

[project.scripts]
vnr = "vnrealty.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vnrealty*"]
